{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "phase.fullname" . }}-migration
  labels:
    {{- include "phase.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "phase.selectorLabels" . | nindent 8 }}
        app: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: migration
        image: postgres:15.4-alpine3.17
        imagePullPolicy: {{ .Values.app.migrations.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.app.migrations.resources | nindent 10 }}
        env:
        - name: OLD_DB_HOST
          value: {{ .Values.migration.oldServiceHost | quote }}
        - name: NEW_DB_HOST
          value: {{ include "phase.fullname" . }}-postgresql
        - name: DATABASE_USER
          value: {{ .Values.database.user | quote }}
        - name: DATABASE_NAME
          value: {{ .Values.database.name | quote }}
        - name: MIGRATION_DRY_RUN
          value: {{ .Values.migration.dryRun | default false | quote }}
        volumeMounts:
        - name: db-pass
          mountPath: /etc/secrets/db-pass
          readOnly: true
        - name: tmp
          mountPath: /tmp
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e

            # Securely set up credentials inside the script
            # This prevents PGPASSWORD from appearing in 'kubectl describe pod' or 'env' of the main process if inspecting via /proc
            echo "Setting up DB credentials..."
            export PGPASSWORD=$(cat /etc/secrets/db-pass/DATABASE_PASSWORD | tr -d '\n')

            echo "Starting migration..."
            if [ "$MIGRATION_DRY_RUN" = "true" ]; then
              echo "DRY RUN MODE ENABLED: No changes will be made."
            fi

            echo "Waiting for New DB ($NEW_DB_HOST) to be ready..."
            until pg_isready -h $NEW_DB_HOST -U $DATABASE_USER; do 
              echo "Waiting for new DB..."
              sleep 2
            done
            
            echo "Waiting for Old DB ($OLD_DB_HOST) to be ready..."
            until pg_isready -h $OLD_DB_HOST -U $DATABASE_USER; do 
              echo "Waiting for old DB..."
              sleep 2
            done

            echo "Pre-flight check: Verifying table counts..."
            # Get table count from old DB
            OLD_COUNT=$(psql -h $OLD_DB_HOST -U $DATABASE_USER -d $DATABASE_NAME -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
            OLD_COUNT=$(echo $OLD_COUNT | xargs) # trim whitespace
            echo "Old DB Table Count: $OLD_COUNT"

            if [ "$MIGRATION_DRY_RUN" = "true" ]; then
              echo "DRY RUN: Skipping data dump/restore."
              echo "DRY RUN: Would execute: pg_dump -h $OLD_DB_HOST ... | psql -h $NEW_DB_HOST ..."
              echo "Migration dry run successful."
              exit 0
            fi

            echo "Dumping data from $OLD_DB_HOST to $NEW_DB_HOST..."
            
            # Use FIFO to reliably capture exit codes from both pg_dump and psql without requiring 'pipefail'
            FIFO_PATH=/tmp/migration_pipe
            rm -f $FIFO_PATH
            mkfifo $FIFO_PATH

            # Background psql reading from pipe
            # We use a subshell to capture the exit code
            (
              set +e
              psql -v ON_ERROR_STOP=1 --single-transaction -h $NEW_DB_HOST -U $DATABASE_USER $DATABASE_NAME < $FIFO_PATH
              echo $? > /tmp/psql_rc
            ) &
            PSQL_PID=$!

            # Run pg_dump writing to pipe
            set +e
            pg_dump -h $OLD_DB_HOST -U $DATABASE_USER $DATABASE_NAME > $FIFO_PATH
            DUMP_RC=$?
            set -e

            # Wait for psql to finish
            wait $PSQL_PID
            PSQL_RC=$(cat /tmp/psql_rc)

            # Check both exit codes
            if [ $DUMP_RC -ne 0 ]; then
              echo "ERROR: pg_dump failed with exit code $DUMP_RC"
              exit 1
            fi

            if [ $PSQL_RC -ne 0 ]; then
              echo "ERROR: psql failed with exit code $PSQL_RC"
              exit 1
            fi
            
            echo "Migration command finished. Verifying..."

            # Get table count from new DB
            NEW_COUNT=$(psql -h $NEW_DB_HOST -U $DATABASE_USER -d $DATABASE_NAME -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
            NEW_COUNT=$(echo $NEW_COUNT | xargs) # trim whitespace
            echo "New DB Table Count: $NEW_COUNT"

            if [ "$OLD_COUNT" != "$NEW_COUNT" ]; then
              echo "ERROR: Migration verification failed! Table counts do not match."
              echo "Old: $OLD_COUNT, New: $NEW_COUNT"
              exit 1
            fi

            echo "Migration successful. Verification passed."
      volumes:
      - name: db-pass
        secret:
          secretName: {{ .Values.migration.oldSecretName | default .Values.phaseSecrets }}
      - name: tmp
        emptyDir: {}
{{- end -}}
